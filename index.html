<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e1a">
<title>LifeOS</title>

    projectId: "academ-ad3db",

</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0a0e1a; --bg-2: #111827; --card: #1a1f2e; --card-2: #232938;
    --border: #2a3142; --text: #e5e7eb; --muted: #9ca3af;
    --accent: #8b5cf6; --accent-2: #a78bfa; --green: #10b981;
    --yellow: #f59e0b; --red: #ef4444; --pink: #ec4899;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body { overscroll-behavior: none; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    background-image: radial-gradient(circle at 10% 0%, rgba(139,92,246,0.15), transparent 40%), radial-gradient(circle at 90% 100%, rgba(236,72,153,0.12), transparent 40%);
    padding-bottom: calc(80px + var(--safe-bottom));
  }
  .container { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .icon { display: inline-block; width: 20px; height: 20px; vertical-align: middle; }
  .icon-lg { width: 32px; height: 32px; }
  .icon-xl { width: 48px; height: 48px; }
  .icon-gradient { stroke: url(#iconGrad); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  
  #authScreen {
    position: fixed; inset: 0; background: var(--bg); z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px;
    overflow-y: auto;
  }
  .auth-box {
    background: linear-gradient(135deg, rgba(139,92,246,0.1), rgba(236,72,153,0.05));
    border: 1px solid var(--border); border-radius: 24px;
    padding: 32px 24px; width: 100%; max-width: 440px; text-align: center;
    backdrop-filter: blur(10px);
  }
  .auth-logo { margin-bottom: 12px; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .auth-box h2 { margin-bottom: 8px; font-size: 28px; background: linear-gradient(135deg, #a78bfa, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .auth-box p { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .auth-input, .auth-select {
    width: 100%; padding: 14px; background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 12px; color: var(--text); font-size: 16px; margin-bottom: 12px; outline: none;
  }
  .auth-input:focus, .auth-select:focus { border-color: var(--accent); }
  .auth-btn {
    width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent), var(--pink));
    color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px;
  }
  .auth-btn:active { transform: scale(0.98); }
  .auth-toggle { margin-top: 16px; font-size: 14px; color: var(--muted); cursor: pointer; }
  .auth-toggle span { color: var(--accent); font-weight: 600; }
  .guest-btn { margin-top: 24px; background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .auth-step { display: none; }
  .auth-step.active { display: block; animation: fadeIn 0.3s; }
  .auth-progress { display: flex; gap: 8px; margin-bottom: 20px; justify-content: center; }
  .auth-progress-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); transition: background 0.3s; }
  .auth-progress-dot.active { background: var(--accent); }
  
  .lang-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 12px 0; }
  .lang-chip { padding: 12px 8px; background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
  .lang-chip.active { background: var(--accent); color: white; border-color: var(--accent); }

  header {
    background: linear-gradient(135deg, rgba(139,92,246,0.15), rgba(236,72,153,0.08));
    border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 16px;
  }
  .header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  h1 { font-size: 24px; background: linear-gradient(135deg, #a78bfa, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 8px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .level-block { flex: 1; min-width: 240px; }
  .level-info { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; }
  .level-info .lvl { color: var(--accent-2); font-weight: 700; font-size: 15px; }
  .xp-bar { height: 12px; background: var(--card-2); border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
  .xp-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--pink)); border-radius: 6px; transition: width 0.5s; }
  .xp-text { font-size: 11px; color: var(--muted); margin-top: 4px; display: flex; justify-content: space-between; }
  
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 8px; text-align: center; }
  .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; }
  .stat-value { font-size: 18px; font-weight: 700; margin-top: 2px; }
  .stat-value.green { color: var(--green); } .stat-value.yellow { color: var(--yellow); } .stat-value.blue { color: var(--blue); }

  .mobile-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(26, 31, 46, 0.98); backdrop-filter: blur(10px);
    border-top: 1px solid var(--border); padding-bottom: var(--safe-bottom);
    z-index: 100; display: flex; justify-content: space-around; padding-top: 8px;
  }
  .mobile-nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; color: var(--muted); font-size: 10px; cursor: pointer; border: none; background: transparent; position: relative; }
  .mobile-nav-item.active { color: var(--accent-2); }
  .nav-badge { position: absolute; top: 4px; right: calc(50% - 20px); background: var(--red); color: white; font-size: 10px; padding: 2px 5px; border-radius: 8px; min-width: 16px; }

  .panel { display: none; }
  .panel.active { display: block; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 12px; }
  .card h2 { font-size: 18px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  
  .task-list { list-style: none; }
  .task-item { display: flex; align-items: flex-start; gap: 12px; padding: 14px; background: var(--card-2); border-radius: 12px; margin-bottom: 8px; border: 1px solid transparent; transition: all 0.2s; }
  .task-item:active { transform: scale(0.99); background: var(--border); }
  .task-item.done { opacity: 0.5; }
  .task-item.done .task-text { text-decoration: line-through; color: var(--muted); }
  .task-item.routine { background: linear-gradient(135deg, rgba(139,92,246,0.1), rgba(236,72,153,0.05)); border-left: 3px solid var(--accent); }
  .task-item.next { border: 1px solid var(--green); box-shadow: 0 0 0 1px rgba(16,185,129,0.3); }
  
  .task-item input[type="checkbox"] { width: 24px; height: 24px; cursor: pointer; accent-color: var(--accent); flex-shrink: 0; margin-top: 2px; }
  .task-text { flex: 1; font-size: 15px; line-height: 1.4; min-width: 0; }
  .task-text small { display: block; color: var(--muted); font-size: 13px; margin-top: 3px; word-break: break-word; }
  .task-time { color: var(--accent-2); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; margin-right: 4px; }
  .task-xp { background: rgba(139,92,246,0.15); color: var(--accent-2); padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; flex-shrink: 0; align-self: center; }
  .task-del { background: transparent; border: none; color: var(--red); cursor: pointer; font-size: 20px; opacity: 0.5; padding: 0 4px; }

  .badge { display: inline-block; padding: 2px 7px; border-radius: 5px; font-size: 10px; font-weight: 600; margin-left: 4px; vertical-align: middle; }
  .badge.js { background: rgba(245,158,11,0.15); color: var(--yellow); }
  .badge.py { background: rgba(139,92,246,0.15); color: var(--accent-2); }
  .badge.en { background: rgba(236,72,153,0.15); color: var(--pink); }
  .badge.git { background: rgba(249,115,22,0.15); color: #fb923c; }
  .badge.project { background: rgba(16,185,129,0.15); color: var(--green); }
  .badge.book { background: rgba(236,72,153,0.15); color: var(--pink); }

  .add-task { display: flex; gap: 8px; margin-top: 12px; }
  .add-task input { flex: 1; padding: 12px; background: var(--card-2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 16px; outline: none; }
  .add-task input:focus { border-color: var(--accent); }
  .add-task input[type="number"] { width: 70px; text-align: center; }
  
  button.btn { padding: 12px 16px; background: linear-gradient(135deg, var(--accent), var(--pink)); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 15px; }
  button.btn:active { transform: scale(0.96); }
  button.btn.ghost { background: var(--card-2); border: 1px solid var(--border); color: var(--text); }
  button.btn.danger { background: linear-gradient(135deg, var(--red), #dc2626); }
  button.btn.small { padding: 8px 12px; font-size: 13px; }

  .progress-mini { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 10px 14px; background: var(--card-2); border-radius: 10px; }
  .progress-mini-label { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .progress-mini-bar { flex: 1; height: 8px; background: var(--card); border-radius: 4px; overflow: hidden; }
  .progress-mini-fill { height: 100%; background: linear-gradient(90deg, var(--green), #059669); border-radius: 4px; transition: width 0.4s; }
  .progress-mini-value { font-size: 13px; font-weight: 600; color: var(--green); white-space: nowrap; }

  .quick-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .quick-actions button { flex: 1; min-width: 140px; padding: 12px; background: var(--card-2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .quick-actions button:active { background: var(--border); }

  /* Profile */
  .profile-header { text-align: center; padding: 20px; background: linear-gradient(135deg, rgba(139,92,246,0.15), rgba(236,72,153,0.08)); border-radius: 16px; margin-bottom: 12px; }
  .profile-avatar { width: 80px; height: 80px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 0 auto 12px; border: 3px solid var(--accent-2); }
  .profile-name { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .profile-bio { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
  .profile-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .profile-stat { background: var(--card-2); padding: 10px; border-radius: 10px; }
  .profile-stat-value { font-size: 18px; font-weight: 700; color: var(--accent-2); }
  .profile-stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; }

  /* Achievements */
  .achievement-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .achievement { background: var(--card-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px; text-align: center; opacity: 0.4; }
  .achievement.unlocked { opacity: 1; border-color: var(--yellow); box-shadow: 0 0 12px rgba(245,158,11,0.3); }
  .achievement-icon { font-size: 32px; margin-bottom: 6px; }
  .achievement-name { font-size: 12px; font-weight: 600; }
  .achievement-desc { font-size: 10px; color: var(--muted); margin-top: 4px; }

  /* Guilds */
  .guild-card { background: linear-gradient(135deg, rgba(139,92,246,0.15), rgba(236,72,153,0.08)); border: 1px solid var(--accent); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .guild-id { font-family: 'Courier New', monospace; font-size: 14px; color: var(--accent-2); background: var(--card-2); padding: 4px 8px; border-radius: 6px; display: inline-block; margin-bottom: 8px; }
  .guild-code { font-family: 'Courier New', monospace; font-size: 20px; font-weight: 700; letter-spacing: 4px; color: var(--accent-2); background: var(--card-2); padding: 8px; border-radius: 8px; text-align: center; margin: 8px 0; }
  .guild-list-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--card-2); border-radius: 10px; margin-bottom: 8px; cursor: pointer; }
  .guild-list-item:active { background: var(--border); }
  .guild-icon { width: 48px; height: 48px; border-radius: 12px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 24px; }
  .guild-rank-num { font-size: 20px; font-weight: 700; color: var(--accent-2); min-width: 30px; }

  /* Chat */
  .chat-container { display: flex; flex-direction: column; height: calc(100vh - 180px); }
  .chat-messages { flex: 1; overflow-y: auto; padding: 12px; background: var(--card-2); border-radius: 12px; margin-bottom: 12px; }
  .chat-msg { margin-bottom: 10px; display: flex; flex-direction: column; }
  .chat-msg.own { align-items: flex-end; }
  .chat-msg.other { align-items: flex-start; }
  .chat-msg-author { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .chat-msg-bubble { padding: 10px 14px; border-radius: 14px; max-width: 80%; word-break: break-word; }
  .chat-msg.own .chat-msg-bubble { background: var(--accent); color: white; border-bottom-right-radius: 4px; }
  .chat-msg.other .chat-msg-bubble { background: var(--card); border-bottom-left-radius: 4px; }
  .chat-msg-time { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .chat-input-row { display: flex; gap: 8px; }
  .chat-input-row input { flex: 1; padding: 12px; background: var(--card-2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 15px; outline: none; }

  /* Messages list */
  .msg-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--card-2); border-radius: 10px; margin-bottom: 8px; cursor: pointer; }
  .msg-item:active { background: var(--border); }
  .msg-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .msg-info { flex: 1; min-width: 0; }
  .msg-name { font-weight: 600; font-size: 14px; }
  .msg-last { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Shop */
  .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .shop-item { background: var(--card-2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; text-align: center; }
  .shop-item-icon { font-size: 36px; margin-bottom: 6px; }

  /* Projects */
  .project-card { background: var(--card-2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .project-stage { display: flex; align-items: center; gap: 8px; padding: 8px; margin-top: 6px; }
  .project-stage input[type="checkbox"] { accent-color: var(--accent); }

  /* Forecast */
  .forecast-card { background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(59,130,246,0.08)); border: 1px solid var(--green); border-radius: 14px; padding: 16px; margin-bottom: 12px; }

  .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--accent); color: white; padding: 12px 24px; border-radius: 24px; font-size: 14px; font-weight: 600; z-index: 1000; opacity: 0; transition: all 0.3s; pointer-events: none; box-shadow: 0 4px 20px rgba(139,92,246,0.4); white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .back-btn { padding: 8px 12px; background: var(--card-2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); cursor: pointer; margin-bottom: 12px; display: inline-flex; align-items: center; gap: 6px; }

  .avatar-picker { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 12px 0; }
  .avatar-option { width: 100%; aspect-ratio: 1; border-radius: 50%; background: var(--card-2); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }
  .avatar-option.active { border-color: var(--accent); background: var(--accent); }

  .color-picker { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  .color-option { width: 36px; height: 36px; border-radius: 50%; cursor: pointer; border: 2px solid var(--border); }
  .color-option.active { border-color: white; }

  @media (max-width: 768px) {
    .container { padding: 12px; }
    h1 { font-size: 20px; }
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .add-task { flex-wrap: wrap; }
    .add-task input[type="number"] { width: 100%; }
  }
</style>
</head>
<body>

<svg style="position: absolute; width: 0; height: 0;">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
  </defs>
</svg>

<div id="authScreen">
  <div class="auth-box">
    <div class="auth-progress">
      <div class="auth-progress-dot active"></div>
      <div class="auth-progress-dot"></div>
      <div class="auth-progress-dot"></div>
      <div class="auth-progress-dot"></div>
    </div>
    
    <div class="auth-step active" id="authStep1">
      <div class="auth-logo">
        <svg class="icon-xl" viewBox="0 0 24 24"><path class="icon-gradient" d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path class="icon-gradient" d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path class="icon-gradient" d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path class="icon-gradient" d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>
      </div>
      <h2>LifeOS</h2>
      <p>Глобальная платформа для разработчиков</p>
      <input type="email" id="authEmail" class="auth-input" placeholder="Email">
      <input type="password" id="authPass" class="auth-input" placeholder="Пароль (мин. 8 символов)">
      <button class="auth-btn" id="authActionBtn" onclick="handleAuth()">Войти</button>
      <div class="auth-toggle" onclick="toggleAuthMode()">
        <span id="authToggleText">Нет аккаунта? Зарегистрироваться</span>
      </div>
      <button class="auth-btn guest-btn" onclick="continueAsGuest()">Продолжить локально</button>
      <p id="authError" style="color: var(--red); font-size: 13px; margin-top: 12px; display: none;"></p>
    </div>

    <div class="auth-step" id="authStep2">
      <div class="auth-logo">
        <svg class="icon-xl" viewBox="0 0 24 24"><path class="icon-gradient" d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle class="icon-gradient" cx="12" cy="7" r="4"/></svg>
      </div>
      <h2>О тебе</h2>
      <input type="text" id="userName" class="auth-input" placeholder="Имя">
      <input type="number" id="userAge" class="auth-input" placeholder="Возраст" min="14" max="99">
      <input type="text" id="userBio" class="auth-input" placeholder="О себе (необязательно)">
      <button class="auth-btn" onclick="nextAuthStep(3)">Далее →</button>
    </div>

  // ============ Helpers ============
  function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text || ''; return div.innerHTML; }
  function todayStr() { return new Date().toISOString().slice(0,10); }
  function addDays(iso, n) { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); }
  function daysBetween(a, b) { return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / 86400000); }
  function getDayOfWeek(iso) { return new Date(iso + 'T00:00:00').getDay(); }
  function getWeekStart(iso) { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() - (d.getDay() === 0 ? 6 : d.getDay() - 1)); return d.toISOString().slice(0,10); }

  window.toggleAuthMode = () => {
    authMode = authMode === 'login' ? 'register' : 'login';
    document.getElementById('authActionBtn').textContent = authMode === 'login' ? 'Войти' : 'Зарегистрироваться';
    document.getElementById('authToggleText').textContent = authMode === 'login' ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти';
    document.getElementById('authError').style.display = 'none';
  };

  window.handleAuth = async () => {
    const email = document.getElementById('authEmail').value.trim();
    const pass = document.getElementById('authPass').value;
    const errEl = document.getElementById('authError');
    if (!email || !pass) { errEl.textContent = 'Введите email и пароль'; errEl.style.display = 'block'; return; }
    if (pass.length < 8) { errEl.textContent = 'Пароль минимум 8 символов'; errEl.style.display = 'block'; return; }
    try {
      if (authMode === 'login') await signInWithEmailAndPassword(auth, email, pass);
      else await createUserWithEmailAndPassword(auth, email, pass);
    } catch (error) {
      errEl.textContent = error.message.replace('Firebase:', '').trim();
      errEl.style.display = 'block';
    }
  };

  window.nextAuthStep = (step) => {
    if (step === 3) {
      const name = document.getElementById('userName').value.trim();
      const age = parseInt(document.getElementById('userAge').value);
      const bio = document.getElementById('userBio').value.trim();
      if (!name || !age) { showToast('Заполни имя и возраст'); return; }
      state.profile = { ...state.profile, name, age, bio };
    } else if (step === 4) {
      const goal = document.getElementById('userGoal').value.trim();
      const level = document.getElementById('userLevel').value;
      if (!goal || !level) { showToast('Заполни цель и уровень'); return; }
      state.profile.goal = goal;
      state.profile.level = level;
    }
    document.querySelectorAll('.auth-step').forEach(s => s.classList.remove('active'));
    document.getElementById('authStep' + step).classList.add('active');
    document.querySelectorAll('.auth-progress-dot').forEach((d, i) => d.classList.toggle('active', i < step));
    authStep = step;
    if (step === 4) renderLangGrid();
  };

    state.lastLogin = todayStr();

    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = 'block';
    loadLocalState();
    initApp();
  };

  window.logout = async () => {
    if (confirm('Выйти из аккаунта?')) { await signOut(auth); location.reload(); }
  };

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      isGuest = false;
      const userRef = ref(db, 'users/' + user.uid);
      onValue(userRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
          const { _index, ...realData } = data;
          state = { ...defaultState, ...realData };
        } else {
          loadLocalState();
          saveToCloud();
        }
        
        if (!state.profile.name || !state.profile.goal) {
          document.getElementById('authScreen').style.display = 'flex';
          document.getElementById('mainApp').style.display = 'none';
          document.querySelectorAll('.auth-step').forEach(s => s.classList.remove('active'));
          if (!state.profile.name) {
            document.getElementById('authStep2').classList.add('active');
            document.querySelectorAll('.auth-progress-dot').forEach((d, i) => d.classList.toggle('active', i < 2));
            authStep = 2;
          } else {
            document.getElementById('authStep4').classList.add('active');
            document.querySelectorAll('.auth-progress-dot').forEach((d, i) => d.classList.toggle('active', i < 4));
            authStep = 4;
            selectedLang = state.profile.lang || 'js';
            renderLangGrid();
          }
        } else {
          document.getElementById('authScreen').style.display = 'none';
          document.getElementById('mainApp').style.display = 'block';
          checkDailyLogin();
          initApp();
        }
      });
      
      if (state.guildId) subscribeToGuild(state.guildId);
      loadAllUsers();
    }
  });

  function checkDailyLogin() {
    const today = todayStr();
    if (state.lastLogin !== today) {
      const yesterday = addDays(today, -1);
      if (state.lastLogin === yesterday) state.loginStreak = (state.loginStreak || 0) + 1;
      else if (state.lastLogin) state.loginStreak = 1;
      else state.loginStreak = 1;
      state.lastLogin = today;
      state.dailyBonusClaimed = null;
      saveToCloud();
      showToast(`🔥 Серия входов: ${state.loginStreak} дней!`);
    }
  }

  function loadLocalState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) state = { ...defaultState, ...JSON.parse(raw) };
    } catch(e) {}
  }

  function saveToCloud() {
    if (isGuest || !currentUser) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      document.getElementById('syncStatus').textContent = 'Локально';
      return;
    }
    document.getElementById('syncStatus').textContent = 'Сохранение...';
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(async () => {
      try {
        await set(ref(db, 'users/' + currentUser.uid), state);
        await updateProfileIndex();
        document.getElementById('syncStatus').textContent = 'Синхронизировано';
      } catch (e) { document.getElementById('syncStatus').textContent = 'Ошибка сети'; }
    }, 800);
  }
  window.debouncedSave = saveToCloud;

  async function loadAllUsers() {
    try {
      const snapshot = await get(child(ref(db), 'users'));
      const users = snapshot.val() || {};
      allUsersCache = {};
      Object.entries(users).forEach(([uid, data]) => {
        if (data._index) allUsersCache[uid] = data._index;
        else if (data.profile?.name) allUsersCache[uid] = { name: data.profile.name, avatar: data.profile.avatar || '🚀', color: data.profile.color || '#8b5cf6', uid };
      });
    } catch(e) {}
  }

  // ============ XP & Levels ============
  function levelFromXp(xp) { return Math.max(1, Math.floor(Math.sqrt(xp / 50)) + 1); }
  function xpForLevel(lvl) { return (lvl-1)*(lvl-1)*50; }
  function xpForNextLevel(lvl) { return lvl*lvl*50; }
  function levelTitle(lvl) {
    if (lvl < 6) return 'Новичок'; if (lvl < 11) return 'Ученик';
    if (lvl < 16) return 'Junior'; if (lvl < 21) return 'Junior+';
    if (lvl < 31) return 'Middle'; if (lvl < 41) return 'Strong Middle';
    if (lvl < 51) return 'Senior'; return 'Tech Lead';
  }
  
  window.addXp = (amount, skipGuild = false) => {
    state.xp += amount;
    if (amount > 0) state.totalXp += amount;
    if (state.xp < 0) state.xp = 0;
    if (!skipGuild && state.guildId && amount > 0) {
      const guildPoints = Math.floor(amount / 2);
      state.guildContribution = (state.guildContribution || 0) + guildPoints;
      updateGuildPoints(guildPoints);
    }
    checkAchievements();
    saveToCloud();
    renderHeader();
  };

  function checkAchievements() {
    const checks = {
      'first_task': Object.keys(state.completedTasks).length >= 1,
      'ten_tasks': Object.keys(state.completedTasks).length >= 10,
      'hundred_tasks': Object.keys(state.completedTasks).length >= 100,
      'xp_1000': state.totalXp >= 1000,
      'xp_10000': state.totalXp >= 10000,
      'streak_7': state.bestStreak >= 7,
      'streak_30': state.bestStreak >= 30,
      'guild_join': state.guildId !== null,
      'guild_1000': state.guildContribution >= 1000,
      'project_done': state.projects.some(p => p.stages?.every(s => s.done)),
      'level_10': levelFromXp(state.xp) >= 10
    };
    ACHIEVEMENTS.forEach(a => {
      if (!state.achievements.includes(a.id) && checks[a.id]) {
        state.achievements.push(a.id);
        state.xp += 100;
        state.totalXp += 100;
        showToast(`🏆 Достижение: ${a.name}! +100 XP`);
      }
    });
  }

  // ============ Guild ============
  async function subscribeToGuild(guildId) {
    if (guildUnsub) guildUnsub();
    const guildRef = ref(db, 'guilds/' + guildId);
    guildUnsub = onValue(guildRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        window.currentGuild = data;
        document.getElementById('guildPoints').textContent = data.totalPoints || 0;
        if (document.getElementById('panel-guilds').classList.contains('active')) renderGuilds();
      }
    });
  }

  window.createGuild = async () => {
    const name = prompt('Название гильдии:');
    if (!name) return;
    const icon = prompt('Иконка (эмодзи):', '🏰') || '🏰';
    const color = prompt('Цвет (hex):', '#8b5cf6') || '#8b5cf6';
    const desc = prompt('Описание:', '') || '';
    
    // Получаем следующий ID
    const counterRef = ref(db, 'guildCounter');
    const counterSnap = await get(counterRef);
    const nextId = (counterSnap.val() || 0) + 1;
    await set(counterRef, nextId);
    const guildId = '#' + String(nextId).padStart(5, '0');
    
    const guildData = {
      id: guildId, name, icon, color, desc,
      ownerId: currentUser.uid,
      members: { [currentUser.uid]: { name: state.profile.name, role: 'owner', contribution: 0, avatar: state.profile.avatar, color: state.profile.color } },
      totalPoints: 0, createdAt: Date.now(), shopPurchases: []
    };
    await set(ref(db, 'guilds/' + guildId), guildData);
    state.guildId = guildId;
    state.guildContribution = 0;
    saveToCloud();
    subscribeToGuild(guildId);
    showToast('Гильдия создана: ' + guildId);
    renderGuilds();
  };

  window.joinGuild = async () => {
    const code = prompt('Введи ID гильдии (например #00001):').trim();
    if (!code) return;
    const guildRef = ref(db, 'guilds/' + code);
    const snapshot = await get(guildRef);
    const data = snapshot.val();
    if (!data) { showToast('Гильдия не найдена'); return; }
    await update(ref(db, 'guilds/' + code + '/members/' + currentUser.uid), { 
      name: state.profile.name, role: 'member', contribution: 0,
      avatar: state.profile.avatar, color: state.profile.color
    });
    state.guildId = code;
    state.guildContribution = 0;
    saveToCloud();
    subscribeToGuild(code);
    showToast('Ты в гильдии ' + data.name + '!');
    renderGuilds();
  };

  async function updateGuildPoints(points) {
    if (!state.guildId) return;
    const guildRef = ref(db, 'guilds/' + state.guildId);
    const snapshot = await get(guildRef);
    const data = snapshot.val();
    if (data) {
      update(guildRef, {
        totalPoints: (data.totalPoints || 0) + points,
        ['members/' + currentUser.uid + '/contribution']: (data.members?.[currentUser.uid]?.contribution || 0) + points
      });
    }
  }

  window.buyGuildItem = async (itemId) => {
    const item = GUILD_SHOP.find(i => i.id === itemId);
    if (!item) return;
    const guildRef = ref(db, 'guilds/' + state.guildId);
    const snapshot = await get(guildRef);
    const data = snapshot.val();
    if ((data.totalPoints || 0) < item.price) { showToast('Недостаточно баллов'); return; }
    if (!confirm(`Купить ${item.name} за ${item.price} баллов?`)) return;
    
    await update(guildRef, {
      totalPoints: data.totalPoints - item.price,
      ['shopPurchases/' + Date.now()]: { itemId, buyer: currentUser.uid, buyerName: state.profile.name, at: Date.now() }
    });
    
    if (itemId === 'lootbox') {
      const bonus = 50 + Math.floor(Math.random() * 450);
      state.xp += bonus; state.totalXp += bonus;
      showToast(`🎁 Лутбокс: +${bonus} XP!`);
    } else {
      showToast(`Куплено: ${item.name}`);
    }
    saveToCloud();
    renderGuilds();
  };

  window.leaveGuild = async () => {
    if (!confirm('Покинуть гильдию?')) return;
    if (state.guildId) {
      await remove(ref(db, 'guilds/' + state.guildId + '/members/' + currentUser.uid));
    }
    state.guildId = null;
    state.guildContribution = 0;
    saveToCloud();
    if (guildUnsub) guildUnsub();
    showToast('Ты покинул гильдию');
    renderGuilds();
  };

  window.promoteMember = async (uid, newRole) => {
    if (!confirm(`Назначить ${newRole}?`)) return;
    await update(ref(db, 'guilds/' + state.guildId + '/members/' + uid), { role: newRole });
    showToast('Роль изменена');
  };

  // ============ Chat ============
  window.openGuildChat = () => {
    currentGuildChat = state.guildId;
    currentChat = null;
    renderChatView();
  };

  window.sendGuildMessage = async () => {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text || !currentGuildChat) return;
    input.value = '';
    const msgRef = push(ref(db, 'guildChats/' + currentGuildChat));
    await set(msgRef, {
      text, author: currentUser.uid, authorName: state.profile.name,
      authorAvatar: state.profile.avatar, authorColor: state.profile.color,
      timestamp: Date.now()
    });
  };

  window.openUserChat = (uid) => {
    if (uid === currentUser.uid) return;
    currentChat = uid;
    currentGuildChat = null;
    renderChatView();
  };

  window.sendUserMessage = async () => {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text || !currentChat) return;
    input.value = '';
    const chatId = [currentUser.uid, currentChat].sort().join('_');
    const msgRef = push(ref(db, 'messages/' + chatId));
    await set(msgRef, {
      text, from: currentUser.uid, to: currentChat,
      fromName: state.profile.name, fromAvatar: state.profile.avatar, fromColor: state.profile.color,
      timestamp: Date.now()
    });
    
    if (!state.achievements.includes('msg_first')) {
      state.achievements.push('msg_first');
      state.xp += 100; state.totalXp += 100;
      showToast('🏆 Достижение: Общительный! +100 XP');
    }
    saveToCloud();
  };

  window.backToMessages = () => {
    currentChat = null;
    currentGuildChat = null;
    if (chatUnsub) { chatUnsub(); chatUnsub = null; }
    Object.values(msgUnsubs).forEach(u => u());
    msgUnsubs = {};
    renderMessages();
  };

  function renderChatView() {
    const panel = document.getElementById('panel-messages');
    if (currentGuildChat) {
      const g = window.currentGuild;
      panel.innerHTML = `
        <button class="back-btn" onclick="backToMessages()">← Назад</button>
        <div class="card" style="padding:12px;">
          <h2 style="font-size:16px;">${g?.icon || '🏰'} ${escapeHtml(g?.name || '')} <span class="guild-id">${currentGuildChat}</span></h2>
        </div>
        <div class="chat-container">
          <div class="chat-messages" id="chatMessages"></div>
          <div class="chat-input-row">
            <input type="text" id="chatInput" placeholder="Сообщение..." onkeypress="if(event.key==='Enter')sendGuildMessage()">
            <button class="btn" onclick="sendGuildMessage()"></button>
          </div>
        </div>
      `;
      subscribeGuildChat(currentGuildChat);
    } else if (currentChat) {
      const user = allUsersCache[currentChat];
      panel.innerHTML = `
        <button class="back-btn" onclick="backToMessages()">← Назад</button>
        <div class="card" style="padding:12px;">
          <div style="display:flex; align-items:center; gap:12px;">
            <div class="msg-avatar" style="background:${user?.color || 'var(--accent)'}; font-size:24px;">${user?.avatar || '👤'}</div>
            <div>
              <div style="font-weight:600;">${escapeHtml(user?.name || 'Пользователь')}</div>
              <div style="font-size:12px; color:var(--muted);">Личный чат</div>
            </div>
          </div>
        </div>
        <div class="chat-container">
          <div class="chat-messages" id="chatMessages"></div>
          <div class="chat-input-row">
            <input type="text" id="chatInput" placeholder="Сообщение..." onkeypress="if(event.key==='Enter')sendUserMessage()">
            <button class="btn" onclick="sendUserMessage()">➤</button>
          </div>
        </div>
      `;
      subscribeUserChat(currentChat);
    }
  }

  function subscribeGuildChat(guildId) {
    if (chatUnsub) chatUnsub();
    const q = query(ref(db, 'guildChats/' + guildId), orderByChild('timestamp'), limitToLast(100));
    chatUnsub = onValue(q, (snapshot) => {
      const msgs = snapshot.val() || {};
      const container = document.getElementById('chatMessages');
      if (!container) return;
      container.innerHTML = Object.entries(msgs).map(([_, m]) => {
        const isOwn = m.author === currentUser.uid;
        const time = new Date(m.timestamp).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
        return `
          <div class="chat-msg ${isOwn ? 'own' : 'other'}">
            <div class="chat-msg-author">${escapeHtml(m.authorName)}${isOwn ? ' (ты)' : ''}</div>
            <div class="chat-msg-bubble">${escapeHtml(m.text)}</div>
            <div class="chat-msg-time">${time}</div>
          </div>
        `;
      }).join('');
      container.scrollTop = container.scrollHeight;
    });
  }

  function subscribeUserChat(uid) {
    Object.values(msgUnsubs).forEach(u => u());
    msgUnsubs = {};
    const chatId = [currentUser.uid, uid].sort().join('_');
    const q = query(ref(db, 'messages/' + chatId), orderByChild('timestamp'), limitToLast(100));
    msgUnsubs[chatId] = onValue(q, (snapshot) => {
      const msgs = snapshot.val() || {};
      const container = document.getElementById('chatMessages');
      if (!container) return;
      container.innerHTML = Object.entries(msgs).map(([_, m]) => {
        const isOwn = m.from === currentUser.uid;
        const time = new Date(m.timestamp).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
        return `
          <div class="chat-msg ${isOwn ? 'own' : 'other'}">
            <div class="chat-msg-author">${isOwn ? 'Ты' : escapeHtml(m.fromName)}</div>
            <div class="chat-msg-bubble">${escapeHtml(m.text)}</div>
            <div class="chat-msg-time">${time}</div>
          </div>
        `;
      }).join('');
      container.scrollTop = container.scrollHeight;
    });
  }

  // ============ Projects ============
  window.addProject = () => {
    const name = prompt('Название проекта:');
    if (!name) return;
    const stagesStr = prompt('Этапы (через запятую):', 'Идея,Дизайн,Разработка,Тестирование,Деплой') || 'Идея,Разработка,Деплой';
    const stages = stagesStr.split(',').map(s => ({ name: s.trim(), done: false }));
    state.projects.push({ id: 'p_' + Date.now(), name, stages, createdAt: todayStr() });
    saveToCloud();
    checkAchievements();
    renderProfile();
  };

  window.toggleStage = (projectId, stageIdx) => {
    const project = state.projects.find(p => p.id === projectId);
    if (project) {
      project.stages[stageIdx].done = !project.stages[stageIdx].done;
      saveToCloud();
      checkAchievements();
      renderProfile();
    }
  };

  // ============ UI Rendering ============
  function renderHeader() {
    const lvl = levelFromXp(state.xp);
    const progress = (state.xp - xpForLevel(lvl)) / (xpForNextLevel(lvl) - xpForLevel(lvl));
    document.getElementById('levelLabel').textContent = `Уровень ${lvl} · ${levelTitle(lvl)}`;
    document.getElementById('xpNumbers').textContent = `${state.xp} / ${xpForNextLevel(lvl)} XP`;
    document.getElementById('xpFill').style.width = Math.min(100, progress * 100) + '%';
    document.getElementById('totalXp').textContent = state.totalXp;
    document.getElementById('bestStreak').textContent = state.bestStreak;
    if (state.profile.name) document.getElementById('userGreeting').textContent = `Привет, ${state.profile.name}!`;
  }

  function buildNav() {
    document.querySelectorAll('.mobile-nav-item').forEach(tab => {
      tab.addEventListener('click', () => switchTab(tab.dataset.tab));
    });
  }

  window.switchTab = (tabName) => {
    document.querySelectorAll('.mobile-nav-item').forEach(t => t.classList.remove('active'));
    document.querySelector(`[data-tab="${tabName}"]`)?.classList.add('active');

  function renderToday() {
    const today = todayStr();
    const panel = document.getElementById('panel-today');
    const isRegDay = state.registrationDate && today === state.registrationDate;
    
    panel.innerHTML = `
      <div class="card">
        <h2>🎯 ${isRegDay ? 'Добро пожаловать!' : 'Задачи на сегодня'} <span style="font-size:13px;color:var(--muted);font-weight:400;margin-left:auto">${formatDate(today)}</span></h2>

        ` : ''}
      </div>
    `;
    
    if (isRegDay) return;
    
    const course = getCourse();

    const weekNum = Math.min(Math.floor(dayNum / 7), course.length - 1);
    const dayOfWeek = getDayOfWeek(today);
    const dowKey = dayOfWeek === 0 ? 0 : dayOfWeek;
    const week = course[weekNum];
    const dayTasks = week?.days[dowKey] || week?.days[1] || [];
    
    const mainTopic = dayTasks.find(t => t[3] && !['book','git'].includes(t[3])) || dayTasks[0];
    const mainTopicText = mainTopic ? mainTopic[0] : 'Учёба по плану';
    const mainTopicSub = mainTopic?.[1] || `Тема недели: ${week?.topic}`;
    
    const bgLang = (dowKey === 1 || dowKey === 3 || dowKey === 5) ? 'py' : (dowKey === 2 || dowKey === 4) ? (state.profile.lang === 'py' ? 'js' : 'py') : null;
    const monthIdx = Math.floor(weekNum / 4);
    const pyTopics = ['Основы: переменные, типы', 'Условия и циклы', 'Функции, списки', 'ООП: классы', 'Работа с файлами', 'Модули, pip', 'REST API на Flask', 'Базы данных: sqlite3', 'Автоматизация скриптов', 'Data Science: pandas', 'Тестирование: pytest', 'Мини-проект'];

    const bgTopic = bgLang === 'py' ? (pyTopics[monthIdx] || 'Практика') : bgLang === 'js' ? (jsTopics[monthIdx] || 'Практика') : null;
    const bgBadge = bgLang || 'book';

    const tasks = [];

    tasks.push({ key: 'r_shower', time: '08:15', text: 'Душ, сборы', xp: 0, badge: 'book' });
    tasks.push({ key: 'r_breakfast', time: '08:45', text: 'Завтрак', xp: 0, badge: 'book' });

  function renderTaskList(tasks, containerId, dateKey, prefix, weekInfo) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = '';
    const bannerId = containerId === 'todayTasks' ? 'todayWeekBanner' : 'dayWeekBanner';
    const banner = document.getElementById(bannerId);
    if (banner && weekInfo) {
      banner.innerHTML = `<div style="background:linear-gradient(135deg,rgba(139,92,246,0.15),rgba(236,72,153,0.08));border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px;"><h3 style="font-size:15px;color:var(--accent-2);margin-bottom:4px;">${weekInfo.title}</h3><p style="font-size:13px;color:var(--muted);"><strong>Тема:</strong> ${weekInfo.topic}</p><div style="margin-top:8px;padding:8px 12px;background:rgba(16,185,129,0.1);border-left:3px solid var(--green);border-radius:6px;font-size:13px;"><strong style="color:var(--green);">Проект недели:</strong> ${weekInfo.project}</div></div>`;
    } else if (banner) { banner.innerHTML = ''; }

    const customs = state.customTasks[dateKey] || [];
    const allTasks = [...tasks.map(t => ({ ...t, type: 'preset' })), ...customs.map(t => ({ ...t, key: 'custom:'+t.id, type: 'custom' }))];

    let nextKey = null;
    for (const task of allTasks) {
      if (!state.completedTasks[taskKey(prefix, task.key, dateKey)]) { nextKey = taskKey(prefix, task.key, dateKey); break; }
    }

    allTasks.forEach(task => {
      const key = taskKey(prefix, task.key, dateKey);
      const done = !!state.completedTasks[key];
      const isNext = key === nextKey;
      const isRoutine = task.badge === 'book';
      const li = document.createElement('li');
      li.className = 'task-item' + (done ? ' done' : '') + (isRoutine ? ' routine' : '') + (isNext ? ' next' : '');
      
      let badgeHtml = '';
      if (task.badge && !isRoutine) {
        badgeHtml = `<span class="badge ${task.badge}">${task.badge.toUpperCase()}</span>`;
      }
      
      li.innerHTML = `<input type="checkbox" ${done ? 'checked' : ''} data-key="${key}" data-xp="${task.xp}"><span class="task-text">${task.time ? `<span class="task-time">${task.time}</span>` : ''} ${task.text}${badgeHtml}${task.sub ? `<small>${task.sub}</small>` : ''}</span><span class="task-xp">+${task.xp}</span>${task.type === 'custom' ? `<button class="task-del" data-key="${key}">×</button>` : ''}`;
      container.appendChild(li);
    });

    container.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.addEventListener('change', e => {
        const key = e.target.dataset.key;
        const xp = parseInt(e.target.dataset.xp);
        const li = e.target.closest('.task-item');
        if (e.target.checked) { state.completedTasks[key] = true; window.addXp(xp); li.classList.add('done'); }
        else { delete state.completedTasks[key]; window.addXp(-xp); li.classList.remove('done'); }
        updateTodayProgress();
        renderHeader();
      });
    });

    container.querySelectorAll('.task-del').forEach(btn => {
      btn.addEventListener('click', e => {
        const key = e.target.dataset.key;
        if (!confirm('Удалить?')) return;
        const xpMatch = e.target.closest('.task-item').querySelector('.task-xp').textContent.match(/\d+/);
        if (xpMatch && state.completedTasks[key]) window.addXp(-parseInt(xpMatch[0]));
        delete state.completedTasks[key];
        for (const d in state.customTasks) state.customTasks[d] = state.customTasks[d].filter(t => 'custom:'+t.id !== key);
        window.debouncedSave();
        renderToday();
      });
    });
    updateTodayProgress();
  }

  function taskKey(prefix, id, date) { return `${prefix}:${id}:${date}`; }

  function updateTodayProgress() {
    const items = document.querySelectorAll('#todayTasks .task-item');
    let done = 0;
    items.forEach(i => { if (i.classList.contains('done')) done++; });
    const pct = items.length ? Math.round(done/items.length*100) : 0;
    const p = document.getElementById('todayProgress');
    const v = document.getElementById('todayProgressValue');
    if (p) p.style.width = pct + '%';
    if (v) v.textContent = pct + '%';
  }

    state.profile.avatar = avatar;
    state.profile.color = color;
    saveToCloud();
    renderProfile();
    renderHeader();
  };

  function calcForecast() {
    const daysSinceReg = state.registrationDate ? daysBetween(state.registrationDate, todayStr()) : 1;
    const tasksPerDay = Object.keys(state.completedTasks).length / Math.max(daysSinceReg, 1);
    const tasksToJunior = 500;
    const daysLeft = Math.ceil((tasksToJunior - Object.keys(state.completedTasks).length) / Math.max(tasksPerDay, 0.1));
    return { daysLeft: Math.max(0, daysLeft), tasksPerDay: tasksPerDay.toFixed(1) };
  }

  function calcBurnout() {
    const recentMoods = Object.entries(state.moods || {})
      .filter(([d]) => daysBetween(d, todayStr()) <= 7)
      .map(([_, v]) => v.value);
    if (recentMoods.length === 0) return { score: 50, level: 'med', avg: '—' };
    const avg = recentMoods.reduce((a, b) => a + b, 0) / recentMoods.length;
    const score = Math.round(avg / 5 * 100);
    const level = score >= 70 ? 'low' : score >= 40 ? 'med' : 'high';
    return { score, level, avg: avg.toFixed(1) };
  }

  function renderMore() {
    const panel = document.getElementById('panel-more');
    panel.innerHTML = `
      <div class="card">
        <h2>⚙️ Настройки</h2>
        <button class="btn ghost" onclick="exportData()" style="width:100%; margin-bottom:8px;"> Экспорт данных</button>
        <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importData(event)">
        <button class="btn ghost" onclick="document.getElementById('importFile').click()" style="width:100%; margin-bottom:8px;"> Импорт данных</button>
        <button class="btn ghost" onclick="changeLang()" style="width:100%; margin-bottom:8px;">🌐 Сменить язык обучения</button>
      </div>
      <div class="card">
        <h3>📊 Статистика</h3>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <div style="padding:12px; background:var(--card-2); border-radius:10px;">
            <div style="font-size:12px; color:var(--muted);">Задач выполнено</div>
            <div style="font-size:24px; font-weight:700; color:var(--green);">${Object.keys(state.completedTasks).length}</div>
          </div>
          <div style="padding:12px; background:var(--card-2); border-radius:10px;">
            <div style="font-size:12px; color:var(--muted);">Достижений</div>
            <div style="font-size:24px; font-weight:700; color:var(--accent-2);">${state.achievements.length}</div>
          </div>
          <div style="padding:12px; background:var(--card-2); border-radius:10px;">
            <div style="font-size:12px; color:var(--muted);">Проектов</div>
            <div style="font-size:24px; font-weight:700; color:var(--green);">${state.projects.length}</div>
          </div>
          <div style="padding:12px; background:var(--card-2); border-radius:10px;">
            <div style="font-size:12px; color:var(--muted);">Дней в системе</div>
            <div style="font-size:24px; font-weight:700; color:var(--yellow);">${state.registrationDate ? daysBetween(state.registrationDate, todayStr()) + 1 : 0}</div>
          </div>
        </div>
      </div>
      <div class="card">
        <button class="btn danger" style="width:100%; margin-bottom:8px;" onclick="resetAll()">️ Сбросить прогресс</button>
        <button class="btn ghost" style="width:100%;" onclick="logout()">🚪 Выйти из аккаунта</button>
      </div>
    `;
  }

  window.changeLang = () => {
    const newLang = state.profile.lang === 'js' ? 'py' : 'js';
    if (confirm(`Сменить язык обучения на ${newLang === 'js' ? 'JavaScript' : 'Python'}? Прогресс задач сохранится.`)) {
      state.profile.lang = newLang;
      saveToCloud();
      showToast('Язык изменён: ' + (newLang === 'js' ? 'JavaScript' : 'Python'));
      renderToday();
    }
  };

  window.exportData = () => {
    const data = JSON.stringify(state, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `lifeos_backup_${todayStr()}.json`;
    a.click();
    showToast('Резервная копия скачана');
  };

  window.importData = (event) => {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        state = { ...defaultState, ...data };
        saveToCloud();
        showToast('Данные восстановлены');
        initApp();
      } catch(err) { showToast('Ошибка импорта'); }
    };
    reader.readAsText(file);
  };

  window.resetAll = () => {
    if (!confirm('Сбросить ВЕСЬ прогресс?')) return;
    state = structuredClone(defaultState);
    saveToCloud();
    initApp();
    showToast('Прогресс сброшен');
  };

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function initApp() {
    buildNav();
    renderHeader();
    renderToday();
    checkAchievements();
  }

  buildNav();
</script>
</body>
</html>
