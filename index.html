<!DOCTYPE html>
<html>
<head><title>Тест Firebase</title></head>
<body>
  <h2>Тест регистрации Firebase</h2>
  <input type="email" id="email" placeholder="Email"><br><br>
  <input type="password" id="pass" placeholder="Пароль (мин 6 символов)"><br><br>
  <button onclick="register()">Зарегистрироваться</button>
  <p id="result" style="color: blue;"></p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA97O7tkAir-P1A2-7sr3Ashj0XjewV0Zs",
      authDomain: "academ-ad3db.firebaseapp.com",
      databaseURL: "https://academ-ad3db-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "academ-ad3db",
      storageBucket: "academ-ad3db.firebasestorage.app",
      messagingSenderId: "69950197764",
      appId: "1:69950197764:web:40d86b32fc7168c8e76551",
      measurementId: "G-RB6KWP8046"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.register = async () => {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('pass').value;
      const resultEl = document.getElementById('result');
      
      try {
        resultEl.textContent = "Регистрация...";
        const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
        resultEl.style.color = "green";
        resultEl.textContent = "Успех! User UID: " + userCredential.user.uid;
      } catch (error) {
        resultEl.style.color = "red";
        resultEl.textContent = "Ошибка: " + error.code + " — " + error.message;
      }
    };
  </script>
</body>
</html>
